name: Lua Build Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  # ============================================================
  # Linux / macOS / Windows
  # ============================================================

  test:
    name: Lua Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang luajit libluajit-5.1-dev luarocks libpng-dev libjpeg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install luajit luarocks libpng jpeg

      - name: Setup MSYS2 UCRT64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-lua-luarocks
            git

      # Check Environment (Linux/macOS)
      - name: Check Clang and LuaJIT (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang --version
          luajit -v
          luarocks --version

      # Check Environment (Windows)
      - name: Check Clang and LuaJIT (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang --version
          luajit -v
          luarocks --version

      # Install Lua-Utils (Linux/macOS)
      - name: Install Lua-Utils (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sudo env "PATH=$PATH" luarocks --lua-version=5.1 install --server=https://luarocks.org/manifests/paulao255 lua-utils develop-1

      # Install Lua-Utils (Windows)
      - name: Install Lua-Utils (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: luarocks --lua-version=5.1 install --server=https://luarocks.org/manifests/paulao255 lua-utils develop-1

      # Run Lua Script (Linux/macOS)
      - name: Run Lua Test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luajit Make.lua test

      # Run Lua Script (Windows)
      - name: Run Lua Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luajit Make.lua test

  # ============================================================
  # Android - ARM64
  # ============================================================

  android:
    name: Lua Test (Android ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Install LuaJIT and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks

      - name: Install Lua-Utils
        shell: bash
        run: sudo env "PATH=$PATH" luarocks --lua-version=5.1 install --server=https://luarocks.org/manifests/paulao255 lua-utils develop-1

      - name: Check Android Environment
        shell: bash
        run: |
          luajit -v

      # Forçamos o vcpkg a usar uma pasta local controlada por nós dentro do projeto
      - name: Install libpng and libjpeg via vcpkg (Android)
        run: |
          vcpkg install libpng:arm64-android libjpeg-turbo:arm64-android --x-install-root=${{ github.workspace }}/vcpkg_installed

      # Passamos o caminho exato da nossa pasta local gerada para a flag -I do Clang
      - name: Run Lua Test
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang -I${{ github.workspace }}/vcpkg_installed/arm64-android/include
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luajit Make.lua test

  # ============================================================
  # iOS - ARM64
  # ============================================================

  ios:
    name: Lua Test (iOS ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LuaJIT and LuaRocks (macOS)
        run: |
          brew install luajit luarocks

      - name: Install Lua-Utils
        shell: bash
        run: sudo env "PATH=$PATH" luarocks --lua-version=5.1 install --server=https://luarocks.org/manifests/paulao255 lua-utils develop-1

      - name: Check iOS Environment
        shell: bash
        run: |
          luajit -v
          xcodebuild -version

      - name: Get iOS SDK
        shell: bash
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "IOS_SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"

      # NOTA: O macOS possui caminhos de inclusão diferentes para pacotes do Homebrew no simulador/dispositivo iOS.
      - name: Run Lua Test
        shell: bash
        env:
          CC: clang -target arm64-apple-ios26.0 -isysroot ${{ env.IOS_SDK_PATH }}
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luajit Make.lua test
